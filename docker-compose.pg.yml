services:
  postgres:
    image: postgres:17-alpine
    container_name: dealdoor-postgres-local
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-54329}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dealdoor}
      POSTGRES_USER: ${POSTGRES_USER:-dealdoor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dealdoor}
    volumes:
      - dealdoor_pg_local:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dealdoor} -d ${POSTGRES_DB:-dealdoor}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  dealdoor_pg_local:
