<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B35;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E55A2B;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="80" fill="url(#bg)"/>
  <g transform="translate(128, 128)">
    <!-- Door shape -->
    <rect x="40" y="20" width="160" height="220" rx="16" fill="white" opacity="0.95"/>
    <rect x="60" y="40" width="120" height="180" rx="8" fill="#FF6B35" opacity="0.1"/>
    
    <!-- Deal tag -->
    <path d="M100 80 L140 80 L160 100 L140 120 L100 120 L80 100 Z" fill="#FF6B35"/>
    <circle cx="120" cy="100" r="12" fill="white"/>
    
    <!-- Door knob -->
    <circle cx="170" cy="140" r="8" fill="#FF6B35"/>
    
    <!-- Text "DD" -->
    <text x="120" y="200" font-family="Inter, sans-serif" font-size="48" font-weight="bold" fill="#1A1A2E" text-anchor="middle">DD</text>
  </g>
</svg>
