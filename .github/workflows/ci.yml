name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Tests, build and isolated demo checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.14'
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Unit and regression tests
        run: bun run test
      - name: Production build for the demo domain
        run: bun run build
        env:
          PUBLIC_SITE_URL: https://dealdoor.suwiwat.com
      - name: Bundle disposable demo fixtures
        run: bun build db/seed.ts --target=node --packages=external --outfile=dist/demo-seed.mjs
      - name: Restricted demo and proxy checks
        run: bun run smoke:demo
        env:
          SMOKE_EXPECT_SITE_URL: https://dealdoor.suwiwat.com
      - name: Private-test opt-in regression checks
        run: node scripts/smoke-demo.mjs --allow-demo-writes
        env:
          SMOKE_EXPECT_SITE_URL: https://dealdoor.suwiwat.com
